{% extends 'base.html' %}{% block content %}<section class="auth card"><p class="eyebrow">GET STARTED</p><h1>Create account</h1><p class="muted">Your account is stored locally on this machine.</p><form method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password <small>(minimum 8 characters)</small><input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button type="submit">Register</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
